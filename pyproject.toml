[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "alerta-ia"
version = "0.1.0"
description = "Alerta Córrego: assistente RAG + QLoRA que responde moradores com base em documentos oficiais"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
